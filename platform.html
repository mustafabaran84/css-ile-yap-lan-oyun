<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTIMATE FOOTBALL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b13;color:#fff;font-family:Arial,sans-serif}
button{cursor:pointer;border:0;font-weight:900;letter-spacing:1px}
.app{max-width:1250px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;
background:linear-gradient(110deg,#131e2d,#080d16);border:1px solid #273448;border-radius:15px 15px 0 0}
.brand{font-size:23px;font-weight:1000;font-style:italic;letter-spacing:2px}
.brand span{color:#7affb1}
.status{font-size:11px;color:#7affb1;letter-spacing:2px;margin-top:6px}
.scoreboard{display:flex;align-items:center;gap:20px;text-align:center}
.team{font-size:12px;color:#c8d6e8}
.score{font-size:36px;font-weight:1000;font-variant-numeric:tabular-nums}
#timer{font-size:15px;color:#aabbd0}
.stage{position:relative;background:#0d3824;overflow:hidden}
canvas{width:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(90deg,#030a12d9,#07121c99,#030a12d9);padding:20px}
.panel{width:min(460px,100%);text-align:center;padding:30px 22px;
background:#0b1424ed;border:1px solid #52687c;border-radius:17px;box-shadow:0 15px 70px #0009}
.kicker{font-size:11px;letter-spacing:4px;color:#7affb1}
h1{font-size:clamp(35px,6vw,58px);font-style:italic;line-height:.95;margin:16px 0}
h1 span{color:#7affb1}
.desc{font-size:13px;color:#adbed1;line-height:1.7;margin:20px 0}
.primary{background:#7affb1;color:#07150d;padding:16px 26px;border-radius:5px;width:100%;font-size:14px}
.primary:hover{background:white;transform:translateY(-1px)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
padding:14px;background:#101927;border:1px solid #273448;border-radius:0 0 14px 14px}
.hints{color:#b5c5d8;font-size:12px;line-height:1.9}
kbd{background:#27364a;border-radius:4px;padding:4px 7px;color:white}
.actions{display:flex;gap:8px;align-items:center}
.secondary{background:#202d40;color:white;padding:12px 14px;border-radius:5px}
.mobile{display:none;gap:8px;align-items:center}
.mobile button{width:48px;height:46px;background:#27364a;color:white;border-radius:8px;font-size:18px}
.mobile .kick{background:#7affb1;color:#06130b;font-size:12px}
@media(max-width:650px){.app{padding:6px}.top{padding:12px 9px}.brand{font-size:15px}
.scoreboard{gap:8px}.score{font-size:26px}.team{font-size:9px}.controls{padding:10px}
.hints{font-size:10px}.mobile{display:flex}.overlay .panel{padding:24px 15px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div><div class="brand">ULTIMATE<span> FC</span></div><div class="status">● CANLI MAÇ MOTORU</div></div>
 <div class="scoreboard">
  <div class="team">YOUR CLUB</div>
  <div><div class="score" id="score">0 : 0</div><div id="timer">00:00</div></div>
  <div class="team">RED UNITED</div>
 </div>
</header>
<div class="stage">
<canvas id="game" width="1100" height="620"></canvas>
<div class="overlay" id="menu">
 <div class="panel">
  <div class="kicker">SEZON 2026 · MAÇ GÜNÜ</div>
  <h1>OWN THE<br><span>GAME.</span></h1>
  <div class="desc">Stadyum senin. Top senin. Zafer senin.<br>Rakibini geç ve galibiyeti al.</div>
  <button class="primary" id="play">MAÇA BAŞLA　 →</button>
  <p style="font-size:10px;color:#8799ad;margin-bottom:0">TEK OYUNCU · HIZLI MAÇ · 90 SANİYE</p>
 </div>
</div>
</div>
<div class="controls">
 <div class="hints">
  <kbd>WASD</kbd> Hareket　<kbd>SHIFT</kbd> Sprint<br>
  <kbd>SPACE</kbd> Şut　<kbd>E</kbd> Pas
 </div>
 <div class="mobile">
  <button data-key="w">↑</button><button data-key="a">←</button>
  <button data-key="s">↓</button><button data-key="d">→</button>
  <button class="kick" data-key=" ">ŞUT</button><button class="kick" data-key="e">PAS</button>
 </div>
 <div class="actions"><button class="secondary" id="pause">Ⅱ DURAKLAT</button>
 <button class="secondary" id="newgame">↻ YENİ MAÇ</button></div>
</div>
</div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const W=1100,H=620,keys={};
let active=false,paused=false,elapsed=0,last=0,raf=0,scoreA=0,scoreB=0;
let particles=[],message='',messageTime=0;
const player={x:300,y:310,vx:0,vy:0,dir:0,stamina:100};
const mates=[{x:225,y:190,n:7},{x:230,y:440,n:11},{x:420,y:310,n:8}];
const foes=[{x:650,y:180,n:4},{x:690,y:440,n:5},{x:760,y:300,n:9},{x:850,y:230,n:2}];
const keeper={x:1000,y:310};
const ball={x:315,y:310,vx:0,vy:0,spin:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hud(){
document.querySelector('#score').textContent=scoreA+' : '+scoreB;
let t=Math.floor(elapsed);
document.querySelector('#timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function reset(){
active=false;paused=false;elapsed=0;scoreA=scoreB=0;particles=[];
Object.assign(player,{x:300,y:310,vx:0,vy:0,stamina:100,dir:0});
mates[0].x=225;mates[0].y=190;mates[1].x=230;mates[1].y=440;mates[2].x=420;mates[2].y=310;
foes[0].x=650;foes[0].y=180;foes[1].x=690;foes[1].y=440;foes[2].x=760;foes[2].y=300;foes[3].x=850;foes[3].y=230;
Object.assign(ball,{x:315,y:310,vx:0,vy:0,spin:0});keeper.y=310;
document.querySelector('#menu').style.display='flex';document.querySelector('#play').textContent='MAÇA BAŞLA →';
document.querySelector('#pause').textContent='Ⅱ DURAKLAT';message='';hud();draw();
}
function field(){
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#187745');g.addColorStop(1,'#084a2c');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<11;i++){ctx.fillStyle=i%2?'#ffffff06':'#00000008';ctx.fillRect(i*100,0,100,H)}
// Stadium audience and floodlights
ctx.fillStyle='#080f1a';ctx.fillRect(0,0,W,43);ctx.fillRect(0,H-43,W,43);
for(let i=0;i<150;i++){let x=(i*79)%W,y=i%2?13:H-22;
ctx.fillStyle=['#d7e5ff','#7affb1','#f5c879','#758aa9'][i%4];
ctx.globalAlpha=.25+(i%4)*.12;ctx.fillRect(x,y,3,3)}
ctx.globalAlpha=1;
for(let x of [80,350,650,950]){
ctx.fillStyle='#d8edff';ctx.shadowColor='#b4d7ff';ctx.shadowBlur=23;
ctx.beginPath();ctx.ellipse(x,43,37,4,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(x,H-43,37,4,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
ctx.strokeStyle='#e4ffedcc';ctx.lineWidth=2.2;
ctx.strokeRect(40,65,1020,490);
ctx.beginPath();ctx.moveTo(550,65);ctx.lineTo(550,555);ctx.stroke();
ctx.beginPath();ctx.arc(550,310,78,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.arc(550,310,3,0,7);ctx.fillStyle='white';ctx.fill();
ctx.strokeRect(40,180,145,260);ctx.strokeRect(40,240,60,140);
ctx.strokeRect(915,180,145,260);ctx.strokeRect(1000,240,60,140);
ctx.beginPath();ctx.arc(145,310,3,0,7);ctx.arc(955,310,3,0,7);ctx.fill();
ctx.beginPath();ctx.arc(145,310,55,-.9,.9);ctx.stroke();
ctx.beginPath();ctx.arc(955,310,55,Math.PI-.9,Math.PI+.9);ctx.stroke();
// nets
ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.strokeRect(17,255,23,110);ctx.strokeRect(1060,255,23,110);
ctx.strokeStyle='#ffffff28';ctx.lineWidth=1;
for(let y=260;y<365;y+=12){ctx.beginPath();ctx.moveTo(17,y);ctx.lineTo(40,y);ctx.moveTo(1060,y);ctx.lineTo(1083,y);ctx.stroke()}
}
function playerDraw(p,home,num,scale=1){
ctx.save();ctx.translate(p.x,p.y);
ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(2,13,17*scale,8*scale,0,0,7);ctx.fill();
// legs
let walk=active&&!paused?Math.sin(elapsed*13+p.x*.02)*3:0;
ctx.strokeStyle='#d9e2e9';ctx.lineWidth=6*scale;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(-5,4);ctx.lineTo(-7+walk,15);ctx.moveTo(5,4);ctx.lineTo(7-walk,15);ctx.stroke();
ctx.strokeStyle='#151d29';ctx.lineWidth=5*scale;
ctx.beginPath();ctx.moveTo(-8+walk,16);ctx.lineTo(-2+walk,16);ctx.moveTo(5-walk,16);ctx.lineTo(12-walk,16);ctx.stroke();
let shirt=home?'#56ffad':'#ff4059',dark=home?'#078f5c':'#a90e36';
ctx.fillStyle=dark;ctx.beginPath();ctx.roundRect(-13*scale,-15*scale,26*scale,25*scale,5);ctx.fill();
ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-11*scale,-17*scale,22*scale,23*scale,5);ctx.fill();
ctx.fillStyle='#fff';ctx.font=`900 ${11*scale}px Arial`;ctx.textAlign='center';ctx.fillText(num,0,0);
ctx.fillStyle='#dca77f';ctx.beginPath();ctx.arc(0,-24*scale,9*scale,0,7);ctx.fill();
ctx.fillStyle='#25232a';ctx.beginPath();ctx.arc(0,-27*scale,9*scale,Math.PI,Math.PI*2);ctx.fill();
ctx.restore();
}
function ballDraw(){
ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.spin);
ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(3,8,11,6,0,0,7);ctx.fill();
let g=ctx.createRadialGradient(-3,-4,1,0,0,11);g.addColorStop(0,'#fff');g.addColorStop(1,'#b9c8d6');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();
ctx.fillStyle='#182537';
for(let i=0;i<5;i++){let a=i*Math.PI*2/5;ctx.beginPath();ctx.arc(Math.cos(a)*5,Math.sin(a)*5,2.2,0,7);ctx.fill()}
ctx.restore();
}
function pop(text,x,y,color='#fff'){
for(let i=0;i<24;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:1,color});
message=text;messageTime=1.2;
}
function draw(){
field();
mates.forEach((p,i)=>playerDraw(p,true,p.n,.9));
foes.forEach((p,i)=>playerDraw(p,false,p.n,.94));
playerDraw(keeper,false,'GK',1.2);
playerDraw(player,true,'10',1.13);ballDraw();
particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;
if(messageTime>0){
ctx.fillStyle='#07121cbb';ctx.beginPath();ctx.roundRect(390,78,320,50,9);ctx.fill();
ctx.fillStyle='#7affb1';ctx.textAlign='center';ctx.font='900 22px Arial';ctx.fillText(message,550,110);
}
if(paused&&active){ctx.fillStyle='#02081299';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='900 48px Arial';ctx.fillText('MAÇ DURAKLATILDI',550,300)}
}
function moveToward(p,x,y,speed){
let dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy)||1;
p.x+=dx/d*speed;p.y+=dy/d*speed;
p.x=clamp(p.x,50,1050);p.y=clamp(p.y,75,545);
}
function resetKickoff(){
player.x=300;player.y=310;ball.x=315;ball.y=310;ball.vx=ball.vy=0;
mates[0].x=225;mates[0].y=190;mates[1].x=230;mates[1].y=440;mates[2].x=420;mates[2].y=310;
foes[0].x=650;foes[0].y=180;foes[1].x=690;foes[1].y=440;foes[2].x=760;foes[2].y=300;foes[3].x=850;foes[3].y=230;keeper.y=310;
}
function update(dt){
elapsed+=dt;if(elapsed>=90){elapsed=90;active=false;document.querySelector('#menu').style.display='flex';
document.querySelector('#play').textContent='TEKRAR OYNA →';message='MAÇ BİTTİ';messageTime=2;return}
let ax=0,ay=0;
if(keys.w||keys.ArrowUp)ay--;if(keys.s||keys.ArrowDown)ay++;
if(keys.a||keys.ArrowLeft)ax--;if(keys.d||keys.ArrowRight)ax++;
let moving=Math.hypot(ax,ay)>0;
let sprint=keys.Shift&&player.stamina>1&&moving;
let speed=sprint?300:210;
if(sprint)player.stamina=Math.max(0,player.stamina-24*dt);
else player.stamina=Math.min(100,player.stamina+12*dt);
let l=Math.hypot(ax,ay)||1;
player.vx=ax/l*speed;player.vy=ay/l*speed;
player.x=clamp(player.x+player.vx*dt,55,1045);
player.y=clamp(player.y+player.vy*dt,80,540);
if(moving)player.dir=Math.atan2(ay,ax);
// Ball follows player when close; collision
let d=dist(player,ball);
if(d<30){
let nx=(ball.x-player.x)/(d||1),ny=(ball.y-player.y)/(d||1);
ball.vx+=player.vx*dt*1.5;ball.vy+=player.vy*dt*1.5;
ball.x+=nx*45*dt;ball.y+=ny*45*dt;
}
// Pass to nearest teammate, target weighted toward attack
if(keys.e&&!keys._e){
keys._e=true;
let target=mates.reduce((best,p)=>p.x>best.x?p:best,mates[0]);
let dx=target.x-ball.x+100,dy=target.y-ball.y,dl=Math.hypot(dx,dy)||1;
ball.vx=dx/dl*480;ball.vy=dy/dl*480;pop('GÜZEL PAS!',ball.x,ball.y,'#7affb1');
}
if(!keys.e)keys._e=false;
// Powerful shot
if(keys[' ']&&!keys._space&&d<62){
keys._space=true;let dx=1065-ball.x,dy=310-ball.y,dl=Math.hypot(dx,dy)||1;
ball.vx=dx/dl*720;ball.vy=dy/dl*720;pop('ŞUT!',ball.x,ball.y,'#ffffff');
}
if(!keys[' '])keys._space=false;
// Opponents pressure ball, one defender chases; others cover lanes
foes.forEach((e,i)=>{
let tx=i===0||i===2?ball.x:Math.max(500,player.x+110);
let ty=i===0||i===2?ball.y:(i===1?430:190);
moveToward(e,tx,ty,(i===0?125:75)*dt);
if(dist(e,ball)<24){
ball.vx-=190*dt;ball.vy+=(ball.y-e.y)*2*dt;
if(Math.random()<dt*.7)pop('TOP KAPILDI!',e.x,e.y,'#ff7888');
}
});
// Teammates move into useful positions
mates.forEach((m,i)=>{let targetX=clamp(player.x+130,170,680);
let targetY=i===0?Math.max(100,player.y-125):i===1?Math.min(520,player.y+125):clamp(player.y,110,510);
moveToward(m,targetX,targetY,45*dt)});
// Keeper tracks ball, dives for shots
keeper.y=clamp(keeper.y+(ball.y-keeper.y)*Math.min(1,dt*3.8),260,360);
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.986,dt*60);ball.vy*=Math.pow(.986,dt*60);
ball.spin+=Math.hypot(ball.vx,ball.vy)*dt*.025;
if(ball.y<75||ball.y>545){ball.y=clamp(ball.y,75,545);ball.vy*=-.68}
if(ball.x<40){ball.x=40;ball.vx=Math.abs(ball.vx)*.7}
if(ball.x>1060){ball.x=1060;ball.vx=-Math.abs(ball.vx)*.7}
// Goal opening
if(ball.x>1060&&Math.abs(ball.y-310)<48&&ball.vx>0){
scoreA++;pop('GOOOOL!',1000,310,'#7affb1');hud();resetKickoff();
}else if(ball.x<40&&Math.abs(ball.y-310)<48&&ball.vx<0){
scoreB++;pop('RAKİP GOL ATTI!',100,310,'#ff536b');hud();resetKickoff();
}
// Keeper saves
if(ball.x>970&&ball.x<1010&&Math.abs(ball.y-keeper.y)<33&&ball.vx>0){
ball.vx=-Math.abs(ball.vx)*.8;ball.vy+=(ball.y-keeper.y)*3;
}
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=80*dt;p.life-=dt*1.5});
particles=particles.filter(p=>p.life>0);
messageTime=Math.max(0,messageTime-dt);hud();
}
function frame(t){
if(!active)return;
let dt=Math.min((t-last)/1000||0,.033);last=t;
if(!paused)update(dt);
draw();raf=requestAnimationFrame(frame);
}
function start(){
cancelAnimationFrame(raf);active=true;paused=false;elapsed=0;
document.querySelector('#menu').style.display='none';
document.querySelector('#pause').textContent='Ⅱ DURAKLAT';
last=performance.now();raf=requestAnimationFrame(frame);
}
document.querySelector('#play').onclick=start;
document.querySelector('#newgame').onclick=()=>{reset();start()};
document.querySelector('#pause').onclick=()=>{
if(!active)return;paused=!paused;
document.querySelector('#pause').textContent=paused?'▶ DEVAM':'Ⅱ DURAKLAT';
};
document.addEventListener('keydown',e=>{
let k=e.key.length===1?e.key.toLowerCase():e.key;
if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
keys[k]=true;
});
document.addEventListener('keyup',e=>{
let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;
});
document.querySelectorAll('[data-key]').forEach(b=>{
const k=b.dataset.key;
const down=e=>{e.preventDefault();keys[k]=true};
const up=e=>{e.preventDefault();keys[k]=false};
b.addEventListener('pointerdown',down);
b.addEventListener('pointerup',up);
b.addEventListener('pointerleave',up);
b.addEventListener('pointercancel',up);
});
reset();
</script>
</body>
</html>
